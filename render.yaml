services:
  - type: web
    name: polishmail-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: APP_BASE_URL
        sync: false
      - key: APP_COOKIE_SECRET
        sync: false
      - key: FREE_TRIAL_PER_DAY
        value: 5
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO_MONTH
        sync: false
      - key: STRIPE_PRICE_PRO_WEEK
        sync: false
      - key: STRIPE_PRICE_JP_PACK
        sync: false
      - key: STRIPE_PRICE_EN_PACK
        sync: false
      - key: STRIPE_PRICE_CN_PACK
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
